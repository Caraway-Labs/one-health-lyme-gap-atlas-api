name: Quality and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the reviewed commit to production after quality checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- openapi.json
      - run: docker build --tag lyme-atlas-api:quality .
      - name: Run report-template regression tests with the production Typst binary
        run: |
          set -euo pipefail
          mkdir .ci-bin
          container_id="$(docker create lyme-atlas-api:quality)"
          docker cp "${container_id}:/usr/local/bin/typst" .ci-bin/typst
          docker rm "${container_id}"
          chmod +x .ci-bin/typst
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          uv run pytest -q tests/test_typst_renderer.py
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy_production &&
      vars.DIGITALOCEAN_APP_ID != '' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.carawaylabs.com/docs
    concurrency: { group: api-production, cancel-in-progress: false }
    steps:
      - name: Deploy the stored App Platform configuration
        env:
          DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          api="https://api.digitalocean.com/v2/apps/${DIGITALOCEAN_APP_ID}"
          deployment_id="$(
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer ${DIGITALOCEAN_ACCESS_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"force_build":true}' \
              "${api}/deployments" | jq --exit-status --raw-output '.deployment.id'
          )"
          test -n "${deployment_id}"
          echo "Triggered DigitalOcean deployment ${deployment_id}"

          for attempt in {1..60}; do
            deployment="$(
              curl --silent --show-error --fail-with-body \
                --header "Authorization: Bearer ${DIGITALOCEAN_ACCESS_TOKEN}" \
                "${api}/deployments/${deployment_id}"
            )"
            phase="$(jq --raw-output '.deployment.phase // empty' <<<"${deployment}")"
            echo "DigitalOcean deployment phase: ${phase}"

            case "${phase}" in
              ACTIVE)
                exit 0
                ;;
              ERROR|CANCELED|SUPERSEDED)
                echo "DigitalOcean deployment ${deployment_id} ended in ${phase}." >&2
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for DigitalOcean deployment ${deployment_id}." >&2
          exit 1
