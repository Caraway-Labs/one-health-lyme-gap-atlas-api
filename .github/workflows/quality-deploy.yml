name: Quality and deploy

# CI_MAX_PARALLEL=4
# Quality runs are not serialized. This workflow has no workflow-level
# concurrency group: one group would queue every run at parallelism 1, which
# is not a four-slot semaphore. There is no matrix, so strategy.max-parallel
# does not apply. Overlapping quality jobs are bounded by the account's
# hosted-runner limit. See docs/ci-and-production-deploy.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Redeploy this main commit to production after quality checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Pytest + coverage
        run: |
          mkdir -p test-results
          uv run pytest -q

      - name: Upload Pytest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: test-results/pytest-junit.xml
          if-no-files-found: warn

      - name: Publish API test results (PR check)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Pytest Results
          path: test-results/pytest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: api
          name: atlas-api
          fail_ci_if_error: false
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- openapi.json
      - run: docker build --tag lyme-atlas-api:quality .
      - name: Run report-template regression tests with the production Typst binary
        run: |
          set -euo pipefail
          mkdir .ci-bin
          container_id="$(docker create lyme-atlas-api:quality)"
          docker cp "${container_id}:/usr/local/bin/typst" .ci-bin/typst
          docker rm "${container_id}"
          chmod +x .ci-bin/typst
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          uv run pytest -q tests/test_typst_renderer.py
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner
  deploy:
    # API_PRODUCTION_CONCURRENCY_GROUP=atlas-api-production
    # LATEST_MAIN_WINS=true
    # A push to main deploys after quality succeeds. workflow_dispatch with
    # deploy_production redeploys that same commit. Pull requests do not deploy.
    # A failed quality job does not deploy: this condition leaves GitHub's
    # default success check in place. Only this job takes the production lock.
    # cancel-in-progress drops an in-progress deploy when another api promotion
    # arrives. The script
    # still refuses the DigitalOcean call unless this SHA is origin/main, because
    # cancellation follows arrival order rather than commit order. The previous
    # group name was api-production; do not put quality in this group.
    if: >-
      vars.DIGITALOCEAN_APP_ID != '' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.carawaylabs.com/docs
    concurrency:
      group: ${{ vars.API_PRODUCTION_CONCURRENCY_GROUP || 'atlas-api-production' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Promote this commit when it is still origin/main
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          APP_NAME: api
        run: PYTHONPATH=src python3 -m lyme_gap_atlas_api.production_deploy
      - name: Smoke canonical public API
        run: python3 scripts/probe_public_api.py --samples 1
