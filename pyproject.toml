[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "one-health-lyme-gap-atlas-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "neo4j>=6,<7",
  "openai>=2.8,<3",
  "one-health-lyme-gap-atlas-knowledge-graph @ git+https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-knowledge-graph.git@kg-v1.0.0",
  "one-health-lyme-gap-atlas-shared[snowflake,observability] @ git+https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-shared-python.git@83ccbe76047185f6aacaff551afd8b03d88aa5cf",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "pypdf>=5,<7",
  "uvicorn[standard]>=0.34,<1",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1", "openapi-spec-validator>=0.7,<0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/lyme_gap_atlas_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/lyme_gap_atlas_api/assistant-policy-v1.json" = "lyme_gap_atlas_api/assistant-policy-v1.json"
"src/lyme_gap_atlas_api/county-review-methodology-v1.config.json" = "lyme_gap_atlas_api/county-review-methodology-v1.config.json"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=lyme_gap_atlas_api",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml:coverage.xml",
  "--cov-report=json:coverage.json",
  "--junitxml=test-results/pytest-junit.xml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lyme_gap_atlas_api"]

[tool.coverage.run]
source = ["lyme_gap_atlas_api"]
branch = true
omit = [
  "*/tests/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
